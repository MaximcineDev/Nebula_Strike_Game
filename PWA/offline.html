<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Strike - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      opacity: 0.5;
    }
    
    h1 {
      font-size: 2rem;
      color: #00d4ff;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    
    p {
      color: #aaa;
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .offline-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .btn {
      padding: 15px 30px;
      border: 2px solid #00d4ff;
      background: transparent;
      color: #00d4ff;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn:hover {
      background: #00d4ff;
      color: #0a0a1a;
    }
    
    .btn-primary {
      background: #00d4ff;
      color: #0a0a1a;
    }
    
    .btn-primary:hover {
      background: #00ffff;
    }
    
    .cached-games {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0, 212, 255, 0.1);
      border-radius: 10px;
      max-width: 400px;
    }
    
    .cached-games h3 {
      color: #00d4ff;
      margin-bottom: 15px;
    }
    
    .game-list {
      list-style: none;
    }
    
    .game-list li {
      padding: 10px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      justify-content: space-between;
    }
    
    .game-list li:last-child {
      border-bottom: none;
    }
    
    .status {
      color: #00ff88;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <svg class="offline-icon pulse" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  
  <h1>Signal Lost</h1>
  <p>You are currently offline. Nebula Strike requires an internet connection for leaderboard updates and purchases, but you can still play cached levels.</p>
  
  <div class="offline-actions">
    <button class="btn btn-primary" onclick="window.location.reload()">
      Retry Connection
    </button>
    <a href="/" class="btn">
      Play Offline Mode
    </a>
  </div>
  
  <div class="cached-games">
    <h3>Available Offline</h3>
    <ul class="game-list">
      <li>
        <span>Levels 1-3</span>
        <span class="status">✓ Ready</span>
      </li>
      <li>
        <span>Local High Scores</span>
        <span class="status">✓ Ready</span>
      </li>
      <li>
        <span>Shop (Cached)</span>
        <span class="status">✓ Ready</span>
      </li>
    </ul>
  </div>
  
  <script>
    // Check if we're back online
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
    
    // Check connection status periodically
    setInterval(() => {
      if (navigator.onLine) {
        window.location.href = '/';
      }
    }, 5000);
  </script>
</body>
</html>
