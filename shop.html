<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shop - Nebula Strike</title>

    <link rel="stylesheet" href="./styles.css">

</head>

<body>

    <div class="game-container">

        <h1>Shop</h1>

        <p>
            Coins:
            <span id="coins">0</span>
        </p>

        <button onclick="buySkin('red', 100)">
            Red Skin - 100
        </button>

        <button onclick="buySkin('green', 150)">
            Green Skin - 150
        </button>

        <button onclick="buySkin('gold', 300)">
            Gold Skin - 300
        </button>

        <br><br>

        <button onclick="goBack()">
            Back
        </button>

    </div>


<script>

const SAVE_KEY = "nebula_save";


function loadSave() {

    let s = localStorage.getItem(SAVE_KEY);

    if (!s) {
        return {
            coins: 0,
            skin: "default",
            achievements: {}
        };
    }

    return JSON.parse(s);
}


function saveGame(data) {

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(data)
    );

}


let SAVE = loadSave();


document.getElementById("coins").innerText =
    SAVE.coins;


function buySkin(name, price) {

    if (SAVE.coins >= price) {

        SAVE.skin = name;

        SAVE.coins -= price;

        saveGame(SAVE);

        alert("Skin bought!");

        location.reload();

    } else {

        alert("Not enough coins");

    }

}


function goBack() {

    window.location.href = "./index.html";

}

</script>


</body>
</html>
