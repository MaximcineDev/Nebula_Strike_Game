<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <title>Shop - Nebula Strike</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <div class="menu">

        <h1>Shop</h1>


        <!-- COINS -->

        <p id="coinText">
            Coins: 0
        </p>



        <!-- ITEMS -->

        <div class="shop-item">

            <h2>Laser Upgrade</h2>

            <button onclick="buyItem('laser')">
                Buy - 50
            </button>

        </div>



        <div class="shop-item">

            <h2>Shield</h2>

            <button onclick="buyItem('shield')">
                Buy - 100
            </button>

        </div>



        <div class="shop-item">

            <h2>Ship Skin</h2>

            <button onclick="buyItem('skin')">
                Buy - 150
            </button>

        </div>



        <br>


        <button onclick="goBack()">
            Back
        </button>


    </div>



<script>


let coins = localStorage.getItem("coins");

if (!coins) coins = 0;

coins = parseInt(coins);

document.getElementById("coinText").innerText =
    "Coins: " + coins;



function buyItem(item)
{

    let price = 0;

    if (item === "laser") price = 50;

    if (item === "shield") price = 100;

    if (item === "skin") price = 150;


    if (coins >= price)
    {

        coins -= price;

        localStorage.setItem("coins", coins);

        alert("Purchased " + item);

        location.reload();

    }
    else
    {

        alert("Not enough coins");

    }

}



function goBack()
{

    window.location.href = "index.html";

}


</script>


</body>

</html>
