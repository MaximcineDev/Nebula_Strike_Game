<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <title>Achievements - Nebula Strike</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <div class="menu">

        <h1>Achievements</h1>


        <div id="achievementList">


            <p id="a1">
                Destroy 10 enemies - Locked
            </p>


            <p id="a2">
                Collect 100 coins - Locked
            </p>


            <p id="a3">
                Beat Boss - Locked
            </p>


        </div>


        <br>


        <button onclick="goBack()">
            Back
        </button>


    </div>



<script>


let enemies =
    parseInt(localStorage.getItem("enemies") || 0);

let coins =
    parseInt(localStorage.getItem("coins") || 0);

let boss =
    localStorage.getItem("boss") || "no";



if (enemies >= 10)
{

    document.getElementById("a1").innerText =
        "Destroy 10 enemies - Completed";

}


if (coins >= 100)
{

    document.getElementById("a2").innerText =
        "Collect 100 coins - Completed";

}


if (boss === "yes")
{

    document.getElementById("a3").innerText =
        "Beat Boss - Completed";

}



function goBack()
{

    window.location.href = "index.html";

}


</script>


</body>

</html>
