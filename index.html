<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Strike</title>

  <!-- Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Favicon (optional) -->
  <link rel="icon" href="icon.png" type="image/png">

  <!-- Styles -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- Offline message -->
  <div id="offlineMessage" style="display:none;position:fixed;top:0;width:100%;background:red;color:white;text-align:center;padding:10px;">
    You are offline
  </div>

  <!-- Game Script -->
  <script src="./app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js');
          console.log('[PWA] SW registered:', registration.scope);

          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdatePrompt(newWorker);
              }
            });
          });

          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'ASSETS_CACHED') {
              console.log(`[PWA] ${event.data.count} assets cached`);
            }
          });

        } catch (error) {
          console.error('[PWA] SW registration failed:', error);
        }
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function showUpdatePrompt(worker) {
      console.log("Update available");
      worker.postMessage({ type: "SKIP_WAITING" });
      window.location.reload();
    }

    function updateOnlineStatus() {
      if (navigator.onLine) {
        document.body.classList.remove('offline');
        document.getElementById('offlineMessage').style.display = 'none';
      } else {
        document.body.classList.add('offline');
        document.getElementById('offlineMessage').style.display = 'block';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
