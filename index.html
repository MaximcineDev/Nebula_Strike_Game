<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Nebula Strike</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<!-- ================= SPLASH ================= -->

<div id="splashScreen">

    <p id="loadingText">Loading...</p>

</div>



<!-- ================= MAIN MENU ================= -->

<div id="main-menu">

    <h1 id="gameTitle">
        Nebula Strike
    </h1>

    <button onclick="startGame()">Play</button>

    <button onclick="openShop()">Shop</button>

    <button onclick="openSettings()">Settings</button>

</div>



<!-- ================= CANVAS ================= -->

<canvas id="gameCanvas"></canvas>



<!-- ================= HUD ================= -->

<div id="hud">

    <div id="levelText">Lv 1</div>

    <div id="scoreText">Score: 0</div>

    <div id="coinBox">

        <img src="assets/ui/coin-icon.png">

        <span id="coinText">0</span>

    </div>

    <button id="pauseBtn">Pause</button>


    <!-- HEARTS -->

    <div id="hearts">

        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">

    </div>

</div>



<!-- ================= BOSS ================= -->

<div id="bossBar">

    <div id="bossHealth"></div>

</div>


<div id="bossWarning">

    WARNING! BOSS INCOMING

</div>



<!-- ================= LEVEL COMPLETE ================= -->

<div id="levelComplete">

    <h1>LEVEL COMPLETE</h1>

    <button onclick="nextLevel()">
        Next Level
    </button>

</div>



<!-- ================= SHOP ================= -->

<div id="shop">

    <img id="shopBg"
         src="assets/ui/shop-bg.png">

    <div id="shopPanel">

        <!-- SKINS -->

        <div id="skins">

            <div class="skinBtn" onclick="buySkin(0)">
                <img src="assets/skin1.png">
            </div>

            <div class="skinBtn locked">
                <img src="assets/skin2.png">
                <img class="lockIcon"
                     src="assets/ui/locked-level.png">
            </div>

            <div class="skinBtn locked">
                <img src="assets/skin3.png">
                <img class="lockIcon"
                     src="assets/ui/locked-level.png">
            </div>

            <div class="skinBtn locked">
                <img src="assets/skin4.png">
                <img class="lockIcon"
                     src="assets/ui/locked-level.png">
            </div>

        </div>


        <!-- SHOP BUTTONS -->

        <div class="shopBtn" onclick="upgradeWeapon()">

            <img src="assets/ui/upgrade-button.png">

            <span>Upgrade Weapon</span>

            <img class="premiumIcon"
                 src="assets/ui/premium-badge.png">

        </div>


        <div class="shopBtn" onclick="buyHearts()">

            <img src="assets/ui/upgrade-button.png">

            <span>Buy Hearts</span>

        </div>


        <div class="shopBtn" onclick="buyShield()">

            <img src="assets/ui/upgrade-button.png">

            <span>Buy Shield</span>

        </div>


        <button onclick="closeShop()">
            Back
        </button>

    </div>

</div>



<!-- ================= PAUSE ================= -->

<div id="pauseMenu">

    <div id="pauseBox">

        <h2>Paused</h2>

        <button onclick="resumeGame()">Resume</button>

        <button onclick="quitGame()">Quit</button>

    </div>

</div>



<!-- ================= SETTINGS ================= -->

<div id="settings">

    <h2>Settings</h2>

    <button onclick="toggleSound()">
        Toggle Sound
    </button>

    <button onclick="closeSettings()">
        Back
    </button>

</div>



<!-- ================= GAME OVER ================= -->

<div id="gameOverScreen">

    <div id="gameOverBox">

        <h1>GAME OVER</h1>

        <button onclick="restartGame()">
            Restart
        </button>

        <button onclick="quitGame()">
            Menu
        </button>

    </div>

</div>



<script src="app.js"></script>

</body>

</html>
