<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Nebula Strike</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192x192.png">
    <meta name="theme-color" content="#00d4ff">
    <meta name="application-name" content="Nebula Strike">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body>

    <!-- SPLASH -->
    <div id="splash" style="display:flex; flex-direction:column; justify-content:center; align-items:center; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; font-size:48px; z-index:100;">
        <h1>Nebula Strike</h1>
        <p>Loading...</p>
    </div>

    <!-- MENU -->
    <div id="main-menu" style="display:none; flex-direction:column; justify-content:center; align-items:center; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; font-size:32px; z-index:100;">
        <h1>Nebula Strike</h1>
        <button id="startBtn" style="margin:10px; font-size:24px; padding:10px 20px;">Start Game</button>
        <button onclick="alert('Achievements coming soon!')" style="margin:10px; font-size:24px; padding:10px 20px;">Achievements</button>
    </div>

    <!-- HUD -->
    <div id="hud" style="position:absolute; top:10px; left:10px; color:white; font-family:Arial, sans-serif; z-index:50;">
        <div id="score-display" style="font-size:20px;">Score: 0</div>
        <div id="coins" style="display:flex; align-items:center; margin-top:5px;">
            <img src="./assets/ui/coin-icon.png" width="24" height="24"> 
            <span id="coin-display" style="margin-left:5px; font-size:20px;">0</span>
        </div>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" style="display:block; background:black;"></canvas>

    <!-- SHOOT BUTTON (for mobile) -->
    <button id="shootBtn" ontouchstart="shoot()" onmousedown="shoot()" style="position:absolute; bottom:20px; right:20px; font-size:24px; padding:15px 25px; z-index:50;">FIRE</button>

    <!-- REWARDED AD SIMULATION (hidden by default) -->
    <div id="rewarded-ad" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; font-size:30px; text-align:center; line-height:100vh; z-index:200;">
        Playing Ad...
    </div>

    <!-- APP SCRIPT -->
    <script src="app.js"></script>

    <!-- SERVICE WORKER -->
    <script>
    window.addEventListener("load", () => {
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("./service-worker.js")
                .then(() => console.log("SW registered"))
                .catch(err => console.log(err));
        }
    });
    </script>

</body>

</html>
