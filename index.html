<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Nebula Strike</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- SPLASH -->

    <div id="splashScreen">

        <p id="loadingText">Loading...</p>

    </div>



    <!-- MAIN MENU -->

    <div id="main-menu">

        <h1>Nebula Strike</h1>

        <button onclick="startGame()">
            Start
        </button>

        <button onclick="openShop()">
            Shop
        </button>

        <button onclick="openSettings()">
            Settings
        </button>

    </div>



    <!-- HUD -->

    <div id="hud">

        <div id="levelText">
            Lv 1
        </div>

        <div id="scoreText">
            Score: 0
        </div>

        <div id="coinBox">

            <img src="ui/coin-icon.png">

            <span id="coinText">
                0
            </span>

        </div>

        <button id="pauseBtn">
            Pause
        </button>


        <!-- HEARTS -->

        <div id="hearts">

            <img class="heart" src="ui/heart-full.png">
            <img class="heart" src="ui/heart-full.png">
            <img class="heart" src="ui/heart-full.png">
            <img class="heart" src="ui/heart-full.png">
            <img class="heart" src="ui/heart-full.png">

        </div>

    </div>



    <!-- BOSS BAR -->

    <div id="bossBar" style="display:none">

        <div id="bossHealth"></div>

    </div>



    <!-- BOSS WARNING -->

    <div id="bossWarning" style="display:none">

        WARNING! BOSS INCOMING

    </div>



    <!-- LEVEL COMPLETE -->

    <div id="levelComplete" style="display:none">

        <h1>LEVEL COMPLETE</h1>

        <button onclick="nextLevel()">
            Next Level
        </button>

    </div>



    <!-- SHOP -->

    <div id="shop" style="display:none">

        <img src="ui/shop-premium.png"
             id="shopBg">

        <div id="shopPanel">

            <h2>Shop</h2>

            <button onclick="buyWeapon()">
                Weapon
            </button>

            <button onclick="buyShield()">
                Shield
            </button>

            <button onclick="closeShop()">
                Back
            </button>

        </div>

    </div>



    <!-- SETTINGS -->

    <div id="settings" style="display:none">

        <h2>Settings</h2>

        <button onclick="closeSettings()">
            Back
        </button>

    </div>



    <!-- CANVAS -->

    <canvas id="gameCanvas"></canvas>



    <script src="app.js"></script>

</body>

</html>
