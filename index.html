<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Nebula Strike</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">
    <meta name="theme-color" content="#00d4ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body>

    <!-- SPLASH -->
    <div id="splash">
        <h1>Nebula Strike</h1>
        <p>Loading...</p>
    </div>

    <!-- MENU -->
    <div id="main-menu">
        <h1>Nebula Strike</h1>
        <button onclick="startGame()">Start Game</button>
        <button onclick="openAchievements()">Achievements</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="score">Score: 0</div>
        <div id="coins">
            <img src="./assets/ui/coin-icon.png" width="24" height="24"> <span id="coin-display">0</span>
        </div>
        <button id="watch-ad-btn">🎁 Watch Ad +100 Coins</button>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- SHOOT BUTTON -->
    <button id="shootBtn" ontouchstart="shoot()" onmousedown="shoot()">FIRE</button>

    <!-- REWARDED AD SIMULATION (hidden by default) -->
    <div id="rewarded-ad" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; font-size:30px; text-align:center; line-height:100vh; z-index:200;">
        Playing Ad...
    </div>

    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("service-worker.js")
                .then(() => console.log("SW registered"))
                .catch(err => console.log(err));
        }
    </script>

</body>

</html>
