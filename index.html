<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Nebula Strike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>


<body>


<!-- ================= SPLASH ================= -->

<div id="splashScreen">

    <p id="loadingText">Loading...</p>

</div>


<!-- ================= MAIN MENU ================= -->
<div id="main-menu">
    <div class="title-container">
        <h1 id="gameTitle">
            <span class="letter">N</span>
            <span class="letter">E</span>
            <span class="letter">B</span>
            <span class="letter">U</span>
            <span class="letter">L</span>
            <span class="letter">A</span>
            <br>
            <span class="letter strike">S</span>
            <span class="letter strike">T</span>
            <span class="letter strike">R</span>
            <span class="letter strike">I</span>
            <span class="letter strike">K</span>
            <span class="letter strike">E</span>
        </h1>
        <div class="title-glow"></div>
    </div>

    <div class="menu-buttons">
        <button class="menu-btn play-btn" onclick="startGame()">
            <span class="btn-text">PLAY</span>
            <div class="btn-shine"></div>
        </button>
        <button class="menu-btn shop-btn" onclick="openShop()">
            <span class="btn-text">SHOP</span>
            <div class="btn-shine"></div>
        </button>
        <button class="menu-btn settings-btn" onclick="openSettings()">
            <span class="btn-text">SETTINGS</span>
            <div class="btn-shine"></div>
        </button>
        <button class="menu-btn settings-btn" onclick="closeApp()">
            <span class="btn-text">CLOSE</span>
            <div class="btn-shine"></div>
        </button>
    </div>
</div>


<!-- ================= CANVAS ================= -->

<canvas id="gameCanvas"></canvas>


<!-- ================= HUD ================= -->

<div id="hud">

    <div id="levelText">Lv 1</div>

    <div id="scoreText">Score: 0</div>

    <div id="coinBox">

        <img src="assets/ui/coin-icon.png">

        <span id="coinText">0</span>

    </div>

    <button id="pauseBtn">Pause</button>


    <!-- HEARTS -->

    <div id="hearts">

        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">
        <img class="heart" src="assets/ui/heart-full.png">

    </div>

</div>


<!-- ================= BOSS ================= -->

<div id="bossBar">

    <div id="bossHealth"></div>

</div>


<div id="bossWarning">

    WARNING! BOSS INCOMING

</div>


<!-- ================= LEVEL COMPLETE ================= -->

<div id="levelComplete" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000;"></div>


<!-- ================= SHOP ================= -->
<div id="shop" style="display: none;">
    
    <!-- BUY SKINS SECTION -->
    <div class="shopSection">
        <h2>Buy Skins</h2>
        <div id="skins">
            <!-- Default -->
            <div class="skinBtn unlocked" onclick="selectSkin(0)">
                <img src="assets/player.png" alt="Default Ship" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23333%22 width=%2280%22 height=%2280%22/><text fill=%22%23fff%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>SHIP 1</text></svg>'">
                <div class="skinLabel">Default</div>
            </div>
            
            <!-- Skin 1 - Locked -->
            <div class="skinBtn locked" id="skin1" onclick="tryBuySkin(1, 100)">
                <img src="assets/skins/skin1.png" alt="Ship 1" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23444%22 width=%2280%22 height=%2280%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>LOCKED</text></svg>'">
                <img class="lockIcon" src="assets/ui/locked-level.png" onerror="this.style.display='none'">
                <div class="skinPrice">100 🪙</div>
            </div>
            
            <!-- Skin 2 - Locked -->
            <div class="skinBtn locked" id="skin2" onclick="tryBuySkin(2, 250)">
                <img src="assets/skins/skin2.png" alt="Ship 2" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23444%22 width=%2280%22 height=%2280%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>LOCKED</text></svg>'">
                <img class="lockIcon" src="assets/ui/locked-level.png" onerror="this.style.display='none'">
                <div class="skinPrice">250 🪙</div>
            </div>
            
            <!-- Skin 3 - Locked -->
            <div class="skinBtn locked" id="skin3" onclick="tryBuySkin(3, 500)">
                <img src="assets/skins/skin3.png" alt="Ship 3" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23444%22 width=%2280%22 height=%2280%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>LOCKED</text></svg>'">
                <img class="lockIcon" src="assets/ui/locked-level.png" onerror="this.style.display='none'">
                <div class="skinPrice">500 🪙</div>
            </div>

            <!-- Skin 4 - Locked -->
            <div class="skinBtn locked" id="skin4" onclick="tryBuySkin(4, 750)">
                <img src="assets/skins/skin4.png" alt="Ship 4" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23444%22 width=%2280%22 height=%2280%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>LOCKED</text></svg>'">
                <img class="lockIcon" src="assets/ui/locked-level.png" onerror="this.style.display='none'">
                <div class="skinPrice">750 🪙</div>
            </div>
        </div>
    </div> <!-- Close shopSection for Skins -->

    <!-- UPGRADES SECTION (separate, not nested) -->
    <div class="shopSection">
        <h2>Upgrades</h2>
        <div class="shopControls">
            <div class="shopBtn" onclick="buyWeapon()">
                <span>Upgrade Weapon (150 🪙)</span>
            </div>
            
            <div class="shopBtn" onclick="buyHearts()">
                <span>Buy Hearts (50 🪙)</span>
            </div>
            
            <div class="shopBtn" onclick="buyShield()">
                <span>Buy Shield (50 🪙)</span>
            </div>
        </div>
    </div> <!-- Close shopSection for Upgrades -->

    <!-- Back button and coin display (outside both sections) -->
    <button class="backBtn" onclick="closeShop()">Back</button>
    
    <div id="shopCoins">Coins: <span id="shopCoinText">0</span></div>
    
</div> <!-- Close shop -->

<!-- ================= PAUSE MENU ================= -->
<div id="pauseMenu">
    <div id="pauseBox">
        <h2>GAME PAUSED</h2>
        <div class="pauseButtons">
            <button class="pauseBtn resumeBtn" onclick="resumeGame()">
                <span>▶ RESUME</span>
            </button>
            <button class="pauseBtn quitBtn" onclick="quitGame()">
                <span>✕ QUIT</span>
            </button>
        </div>
    </div>
</div>



<!-- ================= SETTINGS ================= -->
<div id="settings" style="display: none;">
    <div class="settingsPanel">
        <h2>Settings</h2>
        
        <div class="settingsButtons">
            <button class="settingsBtn soundBtn" onclick="toggleSound()">
                <span id="soundIcon">🔊</span>
                <span id="soundText">Sound: ON</span>
            </button>
            
            <button class="settingsBtn backBtn" onclick="closeSettings()">
                <span>← Back</span>
            </button>
        </div>
        
        <div class="settingsOptions">
            <div class="settingItem">
                <label>Music Volume</label>
                <input type="range" min="0" max="100" value="100" id="musicVol" onchange="setMusicVolume(this.value)">
            </div>
            <div class="settingItem">
                <label>SFX Volume</label>
                <input type="range" min="0" max="100" value="100" id="sfxVol" onchange="setSFXVolume(this.value)">
            </div>
        </div>
    </div>
</div>
    

<!-- ================= GAME OVER ================= -->

<div id="gameOverScreen">

    <div id="gameOverBox">

        <h1>GAME OVER</h1>

        <button onclick="restartGame()">
            Restart
        </button>

        <button onclick="quitGame()">
            Menu
        </button>

    </div>

</div>

<div id="coinWarning">NOT ENOUGH COINS</div>

<script src="app.js"></script>
    

</body>

</html>
