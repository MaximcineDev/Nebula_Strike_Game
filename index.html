<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <title>Nebula Strike</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <div id="main-menu">

        <h1>Nebula Strike</h1>

        <button onclick="startGame()">
            Start Game
        </button>

        <button onclick="openShop()">
            Shop
        </button>

        <button onclick="openAchievements()">
            Achievements
        </button>

    </div>


    <div id="hud">

        <div id="score">0</div>
        <div id="coins">0</div>

    </div>


    <canvas id="gameCanvas"></canvas>


    <button
        id="shootBtn"
        ontouchstart="shoot()"
        onmousedown="shoot()"
    >
        FIRE
    </button>


    <script src="app.js"></script>

</body>

</html>
