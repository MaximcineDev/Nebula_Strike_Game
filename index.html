<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Nebula Strike</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <!-- SPLASH -->

    <div id="splashScreen">

        <img src="assets/ui/splash-screen.png"
             id="splashLogo">

        <p>Loading...</p>

    </div>



    <!-- MAIN MENU -->

    <div id="main-menu">

        <h1>Nebula Strike</h1>

        <button id="startBtn">
            Start
        </button>

        <button onclick="openShop()">
            Shop
        </button>

        <button onclick="openSettings()">
            Settings
        </button>

    </div>



    <!-- HUD -->

    <div id="hud">

        <div id="scoreText">
            Score: 0
        </div>


        <div id="coinBox">

            <img src="assets/ui/coin-icon.png">

            <span id="coinText">
                0
            </span>

        </div>


        <div id="levelText">
            Lv 1
        </div>


        <button id="pauseBtn">
            Pause
        </button>

        <div id="hearts">

            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>

        </div>

    </div>



    <!-- SHOP -->

    <div id="shop">

        <img src="ui/shop-premium.png"
             id="shopBg">


        <div id="shopPanel">

            <h2>Shop</h2>


            <button onclick="buyWeapon()">
                Weapon
            </button>


            <button onclick="buyShield()">
                Shield
            </button>


            <button onclick="closeShop()">
                Back
            </button>

        </div>

    </div>



    <!-- SETTINGS -->

    <div id="settings">

        <h2>Settings</h2>

        <button onclick="closeSettings()">
            Back
        </button>

    </div>



    <!-- CANVAS -->

    <canvas id="gameCanvas"></canvas>



    <script src="app.js"></script>

</body>

</html>
