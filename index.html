<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Nebula Strike</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">

    <meta name="theme-color" content="#00d4ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- AdMob App ID for PWA -->
    <meta name="admob-app-id" content="ca-app-pub-5850163781981893~8491691193">

</head>

<body>

    <!-- SPLASH -->
    <div id="splash">
        <h1>Nebula Strike</h1>
        <p>Loading...</p>
    </div>

    <!-- MENU -->
    <div id="main-menu">
        <h1>Nebula Strike</h1>
        <button onclick="startGame()">Start Game</button>
        <button onclick="openShop()">Shop</button>
        <button onclick="openAchievements()">Achievements</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="score">0</div>
        <div id="coins">Coins: <span id="coin-display">0</span></div>
        <button id="watch-ad-btn" class="menu-btn">Watch Ad +100 Coins</button>
    </div>

    <!-- GAME -->
    <canvas id="gameCanvas"></canvas>

    <!-- ADMOB REWARDED AD CONTAINER -->
    <div id="rewarded-ad" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index:9999;">
        <p style="color:white; text-align:center; margin-top:50%;">Loading Ad...</p>
    </div>

    <!-- SHOOT BUTTON -->
    <button id="shootBtn" ontouchstart="shoot()" onmousedown="shoot()">FIRE</button>

    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("service-worker.js")
                .then(() => console.log("SW registered"))
                .catch(err => console.log(err));
        }
    </script>

</body>
</html>
